[profile.default]
src = "contracts"
out = "out"
# OpenZeppelin is vendored at ./@openzeppelin (scripts/vendor-openzeppelin.sh) so that
# solc source-unit names match the Hardhat build and the bytecode stays byte-identical.
# Only the files this build imports are vendored: the script prunes the rest of the two
# packages away, and nothing solc never opened can be hashed into any metadata trailer.
libs = []
auto_detect_remappings = false
remappings = []
test = "test"
script = "script"
solc_version = "0.8.11"
evm_version = "istanbul"
optimizer = false
optimizer_runs = 200
via_ir = false
use_literal_content = true
bytecode_hash = "ipfs"
cbor_metadata = true
celo = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read", path = "./test/devchain" },
  { access = "read-write", path = "./deployments" },
]

[lint]
lint_on_build = false

# `forge fmt` owns test/ and script/ only. The production contracts are formatted with
# prettier-plugin-solidity instead (`yarn lint:sol:ci`); the two formatters disagree, so
# contracts/ is ignored here, as are the vendored OpenZeppelin sources and the frozen
# Hardhat-era tree. The settings below describe the style test/ and script/ were already
# written in, so turning the formatter on was a mechanical reflow and nothing more.
#
# The ignore globs need the trailing "/*": a bare "contracts/**" matches the nested files
# but not the ten sitting directly under contracts/, which forge would then reformat.
[fmt]
ignore = ["contracts/**/*", "@openzeppelin/**/*"]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
# prettier, and with it the existing code, breaks the attributes out of a too-long function
# header before it breaks up the parameter list; "params_first" would rewrap every such
# header. Both styles are present because a header whose parameters do not fit ends up
# parameter-per-line under either setting.
multiline_func_header = "attributes_first"
single_line_statement_blocks = "preserve"
wrap_comments = false
sort_imports = false

[rpc_endpoints]
celo = "https://forno.celo.org"
# `sepolia` is Celo Sepolia (11142220), the current testnet.
sepolia = "https://forno.celo-sepolia.celo-testnet.org/"
local = "http://localhost:8545"

[etherscan]
# No `url`: Celoscan is served by the unified Etherscan V2 API, which forge picks for the
# chain on its own. The V1 endpoint that used to be spelled out here (api.celoscan.io) was
# retired in August 2025 and answers every request with "deprecated V1 endpoint".
#
# One etherscan.io key covers every chain in the V2 API. When CELOSCAN_API_KEY is unset the
# interpolation below does not resolve and forge falls back to ETHERSCAN_API_KEY, which is
# the name `.env.example` now carries.
celo = { key = "${CELOSCAN_API_KEY}", chain = 42220 }
sepolia = { key = "${CELOSCAN_API_KEY}", chain = 11142220 }

