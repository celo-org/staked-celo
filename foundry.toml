[profile.default]
src = "contracts"
out = "out"
# OpenZeppelin is vendored at ./@openzeppelin (scripts/vendor-openzeppelin.sh) so that
# solc source-unit names match the Hardhat build and the bytecode stays byte-identical.
libs = []
auto_detect_remappings = false
remappings = []
test = "test"
script = "script"
solc_version = "0.8.11"
evm_version = "istanbul"
optimizer = false
optimizer_runs = 200
via_ir = false
use_literal_content = true
bytecode_hash = "ipfs"
cbor_metadata = true
celo = true
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read", path = "./test/devchain" },
  { access = "read-write", path = "./deployments" },
]

[lint]
lint_on_build = false

[rpc_endpoints]
celo = "https://forno.celo.org"
alfajores = "https://alfajores-forno.celo-testnet.org/"
staging = "https://staging-forno.celo-networks-dev.org/"
local = "http://localhost:8545"

[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", chain = 42220, url = "https://api.celoscan.io/api" }

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 500
