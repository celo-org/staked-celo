name: CI-Pipeline

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Keep in sync with mise.toml, which pins the same version for local development.
  FOUNDRY_VERSION: v1.8.1
  # The release the upgradeable contracts must stay storage- and ABI-compatible with.
  COMPATIBILITY_BASELINE: releases/4

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      # package.json carries the lint tooling only (prettier, solhint) plus the
      # devchain fixture package, so this tracks a supported release.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn

      - name: Install dependencies
        run: yarn

      # prettier and solhint only; the project deliberately does not use `forge fmt`,
      # whose formatting differs from prettier-plugin-solidity.
      - name: Lint Solidity
        run: yarn lint:sol:ci

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The devchain fixture is extracted from an npm package, so node is needed even
      # though nothing in the test-suite itself runs on node. Nothing from
      # package.json is installed here, so this is free to track a supported release.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Cache the Celo devchain fixture
        uses: actions/cache@v4
        with:
          path: |
            test/devchain/allocs.json
            test/devchain/meta.json
          # The pinned version lives in package.json, so the cache key follows it.
          key: devchain-${{ hashFiles('package.json', 'scripts/prepare-devchain.sh') }}

      - name: Prepare the devchain fixture
        run: scripts/prepare-devchain.sh

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

  bytecode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Build
        run: forge build

      # The deployed contracts must keep compiling to exactly the bytecode that was
      # audited and deployed, which is also the bytecode the old Hardhat toolchain
      # produced. scripts/bytecode-reference.json pins a digest of the creation and
      # runtime bytecode of every contract under contracts/, so this job fails on any
      # contract edit and on any change to the compiler settings in foundry.toml
      # (solc version, evm version, optimizer, metadata), because the settings are
      # hashed into the metadata trailer of the bytecode.
      #
      # When a contract change is intended, regenerate the reference in the same
      # commit and review its diff as carefully as the contract diff:
      #
      #   forge build
      #   python3 scripts/bytecode-compat-check.py --update-reference scripts/bytecode-reference.json
      - name: Check bytecode against the pinned reference
        run: python3 scripts/bytecode-compat-check.py --reference scripts/bytecode-reference.json

  compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Checkout the compatibility baseline
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ env.COMPATIBILITY_BASELINE }}

      # The comparison below is the only thing standing between an upgrade and a
      # corrupted proxy, so its own rules are covered by unit tests. They build
      # storage layouts in memory and need nothing but python, hence running them
      # here, ahead of the two builds.
      - name: Test the compatibility checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The baseline release predates the Foundry migration, so it carries no
      # foundry.toml and no vendored OpenZeppelin. Overlaying the current toolchain
      # onto its contracts/ builds them with exactly the settings used here, which is
      # what makes the two out/ directories comparable. The baseline imports the same
      # "@openzeppelin/..." paths, so the vendored copy resolves without remappings.
      - name: Overlay the current toolchain onto the baseline
        run: |
          cp foundry.toml baseline/foundry.toml
          rm -rf baseline/@openzeppelin baseline/scripts
          cp -R @openzeppelin baseline/@openzeppelin
          cp -R scripts baseline/scripts

      - name: Build the current contracts
        run: forge build

      - name: Build the baseline contracts
        run: forge build --root baseline

      # Storage layout and ABI compatibility for every upgradeable contract, i.e. the
      # check the Hardhat @celo/contract-compatibility-check job used to perform.
      - name: Check upgrade compatibility against ${{ env.COMPATIBILITY_BASELINE }}
        run: python3 scripts/abi-compat-check.py --baseline baseline/out --current out
